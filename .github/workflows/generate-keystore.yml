name: Generate Permanent Keystore & Certificate

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for Keystore and Key'
        required: true
        default: 'QuranVideoStudio2026!'
      alias:
        description: 'Key Alias'
        required: true
        default: 'quran-key'

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Keystore & Export PEM Certificate
        run: |
          mkdir -p output
          PASSWORD="${{ github.event.inputs.password }}"
          ALIAS="${{ github.event.inputs.alias }}"

          echo "Generating Keystore..."
          keytool -genkeypair -v \
            -keystore output/quran-release-key.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Quran Video Studio, OU=Production, O=Quran, L=Paris, S=IDF, C=FR"

          echo "Exporting PEM Certificate for Google Play Console..."
          keytool -export -rfc \
            -keystore output/quran-release-key.jks \
            -alias "$ALIAS" \
            -storepass "$PASSWORD" \
            -file output/upload_certificate.pem

          echo "Encoding Keystore to Base64..."
          base64 -w 0 output/quran-release-key.jks > output/keystore_base64.txt

          echo "Getting Certificate SHA1 and SHA256 Fingerprints..."
          FINGERPRINTS=$(keytool -list -v -keystore output/quran-release-key.jks -alias "$ALIAS" -storepass "$PASSWORD" | grep -E "SHA1:|SHA256:")

          cat <<EOF > output/SETUP_INSTRUCTIONS.md
          # Next Steps for Quran Video Studio

          ## 1. Google Play Console
          - Go to Google Play Console > App Integrity > App Signing.
          - Click "Request upload key reset".
          - Upload the file: upload_certificate.pem

          ## 2. GitHub Repository Secrets
          Go to Settings > Secrets and variables > Actions, and create:
          - ANDROID_KEYSTORE_BASE64: (content from keystore_base64.txt)
          - ANDROID_KEYSTORE_PASSWORD: $PASSWORD
          - ANDROID_KEY_ALIAS: $ALIAS
          - ANDROID_KEY_PASSWORD: $PASSWORD
          EOF

          # Print to GitHub Actions Step Summary
          echo "## 🔑 Keystore & Certificate Generated Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Certificate Fingerprints" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$FINGERPRINTS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download the **Quran-Release-Keystore-And-Certificate** zip artifact from this run to get:" >> $GITHUB_STEP_SUMMARY
          echo "1. \`upload_certificate.pem\` (Upload this to Google Play Console)" >> $GITHUB_STEP_SUMMARY
          echo "2. \`keystore_base64.txt\` (Copy the content of this file into GitHub Secret \`ANDROID_KEYSTORE_BASE64\`)" >> $GITHUB_STEP_SUMMARY
          echo "3. \`quran-release-key.jks\` (Your permanent release keystore - save it somewhere safe!)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Release-Keystore-And-Certificate
          path: output/*
          retention-days: 14
